<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仓库管理后台 · 库位配置建设 Demo</title>
<style>
  :root{
    --blue:#1677ff; --blue-bg:#e6f4ff; --blue-dk:#0958d9;
    --bg:#f5f6f8; --card:#fff; --line:#e8eaee; --line2:#d9d9d9;
    --text:#1f2329; --muted:#6b7280; --muted2:#9ca3af;
    --green:#52c41a; --green-bg:#f6ffed; --green-bd:#b7eb8f;
    --red:#ff4d4f; --red-bg:#fff1f0; --red-bd:#ffa39e;
    --amber:#fa8c16; --amber-bg:#fff7e6; --amber-bd:#ffd591;
    --purple:#722ed1; --purple-bg:#f9f0ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:13px;line-height:1.6;overflow-x:hidden}
  .num{font-variant-numeric:tabular-nums}
  /* 顶栏 */
  .topbar{position:fixed;top:0;left:0;right:0;height:56px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px;z-index:100}
  .logo{display:flex;align-items:center;gap:10px;min-width:220px}
  .logo .lg{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--blue),#36c);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
  .logo .lt{font-weight:800;font-size:15px;color:#1a1a1a;white-space:nowrap}
  .logo .lt small{display:block;font-size:10px;color:var(--muted2);font-weight:500;letter-spacing:.5px}
  .topbar .ttl{font-size:14px;font-weight:700;margin-left:8px}
  .topbar .right{margin-left:auto;display:flex;align-items:center;gap:14px}
  .env-tag{display:inline-flex;align-items:center;gap:5px;background:var(--blue-bg);color:var(--blue);border:1px solid #91caff;border-radius:14px;padding:1px 10px;font-size:11.5px;font-weight:600}
  .env-tag i{width:6px;height:6px;border-radius:50%;background:var(--blue);display:inline-block}
  .user{display:flex;align-items:center;gap:8px;font-size:13px}
  .user .av{width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
  /* 侧栏 */
  .sider{position:fixed;top:56px;left:0;bottom:0;width:220px;background:var(--card);border-right:1px solid var(--line);overflow-y:auto;z-index:99}
  .menu-group{font-size:11px;color:var(--muted2);padding:14px 16px 6px;font-weight:600}
  .menu-item{display:flex;align-items:center;gap:9px;padding:9px 16px;cursor:pointer;font-size:13px;color:#3d4757;position:relative}
  .menu-item:hover{background:#f5f7fa}
  .menu-item .ic{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
  .menu-item .ic svg{width:16px;height:16px}
  .menu-item.on{background:var(--blue-bg);color:var(--blue);font-weight:600}
  .menu-item.on .ic{color:var(--blue)}
  .menu-item .arr{margin-left:auto;font-size:10px;color:var(--muted2);transition:transform .15s}
  .menu-item.open .arr{transform:rotate(90deg)}
  .submenu{display:none}
  .submenu.show{display:block}
  .sub-item{padding:8px 16px 8px 41px;font-size:13px;color:#4a5568;cursor:pointer;position:relative}
  .sub-item:hover{color:var(--blue);background:#f5f7fa}
  .sub-item.on{color:var(--blue);font-weight:600;background:var(--blue-bg)}
  .new-badge{display:inline-block;background:var(--red);color:#fff;font-size:10px;line-height:1;padding:2px 5px;border-radius:8px;margin-left:6px;font-weight:700}
  .guide{padding:12px 16px;font-size:11px;color:var(--muted2);line-height:2}
  .guide b{color:#4a5568}
  /* 内容区 */
  .content{margin:56px 0 0 220px;padding:16px 18px 60px;min-height:calc(100vh - 56px)}
  .crumbs{font-size:12px;color:var(--muted2);margin-bottom:10px}
  .crumbs b{color:var(--text);font-weight:600}
  .page-title{font-size:18px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:10px}
  .page-title .tag-new{background:var(--red);color:#fff;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:700}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px}
  .panel-title{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .panel-title .desc{font-size:12px;color:var(--muted2);font-weight:400;margin-left:4px}
  .filter{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .fitem{display:flex;align-items:center;gap:6px}
  .fitem .flab{color:var(--muted);font-size:12.5px;white-space:nowrap}
  .inp{height:30px;border:1px solid var(--line2);border-radius:6px;padding:0 10px;font-size:12.5px;font-family:inherit;background:#fff;min-width:150px;outline:none}
  .inp:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(22,119,255,.15)}
  .inp.sm{min-width:110px;width:110px}
  .sel{height:30px;border:1px solid var(--line2);border-radius:6px;padding:0 8px;font-size:12.5px;background:#fff;outline:none;color:var(--text)}
  .btn{height:30px;border:1px solid var(--line2);border-radius:6px;padding:0 14px;font-size:12.5px;font-weight:600;cursor:pointer;background:#fff;color:var(--text);font-family:inherit;display:inline-flex;align-items:center;gap:5px}
  .btn:hover{border-color:var(--blue);color:var(--blue)}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
  .btn.primary:hover{background:var(--blue-dk)}
  .btn.danger{background:var(--red);border-color:var(--red);color:#fff}
  .btn.sm{height:26px;padding:0 10px;font-size:12px}
  .btn.link{height:26px;border:none;color:var(--blue);padding:0 6px;background:transparent}
  .btn.link:hover{background:var(--blue-bg)}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .btn[disabled]:hover{border-color:var(--line2);color:var(--text)}
  /* 表格 */
  table.tb{width:100%;border-collapse:collapse;font-size:12.8px}
  .tb th{background:#fafafa;border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;font-weight:600;color:#4a5568;white-space:nowrap}
  .tb td{border-bottom:1px solid var(--line);padding:8px 10px;vertical-align:middle}
  .tb tr:hover td{background:#fafcff}
  .badge{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;font-weight:600;line-height:1.7}
  .badge.b-green{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bd)}
  .badge.b-red{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bd)}
  .badge.b-amber{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-bd)}
  .badge.b-blue{background:var(--blue-bg);color:var(--blue);border:1px solid #91caff}
  .badge.b-gray{background:#fafafa;color:var(--muted);border:1px solid var(--line2)}
  .badge.b-purple{background:var(--purple-bg);color:var(--purple);border:1px solid #d3adf7}
  .badge.click{cursor:pointer}
  .pager{display:flex;align-items:center;gap:6px;margin-top:14px;font-size:12.5px;color:var(--muted)}
  .pager .total{margin-right:auto}
  /* 弹窗 */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none}
  .mask.show{display:flex;align-items:center;justify-content:center}
  .modal{background:#fff;border-radius:12px;width:640px;max-width:92vw;max-height:86vh;display:flex;flex-direction:column;box-shadow:0 8px 30px rgba(0,0,0,.2)}
  .modal-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;font-size:15px;font-weight:700}
  .modal-head .x{margin-left:auto;cursor:pointer;color:var(--muted2);font-size:18px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px}
  .modal-head .x:hover{background:#f5f5f5;color:var(--text)}
  .modal-body{padding:18px;overflow-y:auto}
  .modal-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
  .form-row{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .fld{display:flex;flex-direction:column;gap:5px;flex:1;min-width:200px}
  .fld .fl{font-size:12.5px;color:var(--muted)}
  .fld .fl b{color:var(--red)}
  .fld .inp{width:100%}
  .fld .sel{width:100%}
  .fl-hint{font-size:11.5px;color:var(--muted);margin-top:4px}
  .rule-note{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.8}
  .opt-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
  .opt{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--text);cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px 9px;user-select:none}
  .opt input{accent-color:var(--blue)}
  .opt.on{border-color:var(--blue);background:var(--blue-bg);color:var(--blue)}
  /* 存放模式卡片 */
  .mode-cards{display:flex;gap:10px;flex-wrap:wrap}
  .mode-card{flex:1;min-width:160px;border:1.5px solid var(--line2);border-radius:9px;padding:11px 13px;cursor:pointer}
  .mode-card.on{border-color:var(--blue);background:var(--blue-bg)}
  .mode-card b{font-size:13px}
  .mode-card .d{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.6}
  /* 配置说明条 */
  .cfg-tip{display:flex;gap:10px;align-items:flex-start;background:var(--blue-bg);border:1px solid #91caff;border-radius:9px;padding:10px 14px;margin-bottom:14px;font-size:12.5px;line-height:1.8}
  .cfg-tip b{color:var(--blue)}
  .cfg-tip.amber{background:var(--amber-bg);border-color:var(--amber-bd)}
  .cfg-tip.amber b{color:var(--amber)}
  /* toast */
  .toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:9px 22px;border-radius:8px;font-size:13px;z-index:300;opacity:0;transition:opacity .25s;pointer-events:none}
  .toast.show{opacity:1}
  .mono{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--muted)}
  .kpi-row{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .kpi{flex:1;min-width:160px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
  .kpi .l{font-size:11.5px;color:var(--muted)}
  .kpi .n{font-size:22px;font-weight:800;margin-top:2px}
  .kpi .s{font-size:11px;color:var(--muted2)}
</style>
</head>
<body>

<!-- 顶栏 -->
<div class="topbar">
  <div class="logo"><div class="lg">科</div><div class="lt">科管数据中台<small>WAREHOUSE ADMIN</small></div></div>
  <div class="ttl">仓库管理后台 · 库位配置建设</div>
  <div class="right">
    <span class="env-tag"><i></i>UAT环境</span>
    <span class="user"><span class="av">A</span>admin</span>
  </div>
</div>

<!-- 侧栏 -->
<div class="sider" id="sider">
  <div class="menu-group">基础数据</div>
  <div class="menu-item" data-page="wh"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21V8l9-5 9 5v13"/><path d="M3 21h18M9 21v-6h6v6"/></svg></span>仓库管理</div>
  <div class="menu-group">仓储管理</div>
  <div class="menu-item open" id="menu-loc"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v4H4zM4 10h16v4H4zM4 16h16v4H4z"/></svg></span>库位配置<span class="arr">▶</span></div>
  <div class="submenu show" id="sub-loc">
    <div class="sub-item" data-page="area">库区管理<span class="new-badge">新</span></div>
    <div class="sub-item" data-page="shelf">货架与货位<span class="new-badge">新</span></div>
    <div class="sub-item" data-page="esl">价签管理<span class="new-badge">新</span></div>
    <div class="sub-item" data-page="tag">标签打印<span class="new-badge">新</span></div>
  </div>
  <div class="guide">
    <b>配置建设路径</b><br>
    ① 建仓库<br>② 建库区 · 选存放模式<br>③ 货架区：建货架→层级→货位<br>④ 散货区：打印库区标识码<br>⑤ 统一制签张贴
  </div>
</div>

<!-- 内容区 -->
<div class="content" id="content"></div>

<!-- 弹窗 -->
<div class="mask" id="mask"></div>
<div class="toast" id="toast"></div>

<script>
/* ===== 工具 ===== */
var $=function(s){return document.querySelector(s)};
function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('show')},2200);}
function openModal(html){
  $('#mask').innerHTML='<div class="modal"><div class="modal-head">'+html.title+'<div class="x" onclick="closeModal()">✕</div></div><div class="modal-body">'+html.body+'</div><div class="modal-foot">'+html.foot+'</div></div>';
  $('#mask').classList.add('show');
}
function closeModal(){$('#mask').classList.remove('show');}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function pad(n){return n<10?('0'+n):(''+n)}
var CUR='wh';

/* ===== 数据（与 PDA 库位管理 Demo 同构） ===== */
var WH_LIST=[
  {code:'C01',name:'01号仓库',areas:[{code:'C01-K01',name:'01号库区',kind:'shelf'},{code:'C01-K02',name:'02号库区',kind:'mix',openItems:[
    {sku:'标准快递纸箱（大）',no:'AIWB-0120b',tag:'ESL-20230401',stock:18}
  ]}]},
  {code:'C02',name:'02号仓库',areas:[{code:'C02-K01',name:'01号库区',kind:'open',openItems:[
    {sku:'一次性手套（大号）',no:'AIWB-0077g',tag:'ESL-20230301',stock:36},
    {sku:'离心管 50mL',no:'AIWB-0088c',tag:'ESL-20230302',stock:120},
    {sku:'移液枪头盒（盒装）',no:'AIWB-0099t',tag:'ESL-20230303',stock:0}
  ]}]}
];
function findArea(code){var r=null;WH_LIST.forEach(function(w){w.areas.forEach(function(a){if(a.code===code)r=a})});return r}
function findWh(code){var r=null;WH_LIST.forEach(function(w){if(w.code===code)r=w});return r}
function genLayers(lvN,binN){
  var arr=[];
  for(var i=0;i<lvN;i++){
    var bins=[];
    for(var j=0;j<binN;j++)bins.push({seq:j+1,state:'empty',sku:'',no:'',tag:'',stock:0});
    arr.push({name:pad(i+1)+'号层级',bins:bins});
  }
  return arr;
}
function areaSeqN(code){return parseInt((code.split('-')[1]||'01').replace('K',''),10)||1}
function newShelf(areaCode,seq,lvN,binN){
  return {code:areaCode+'-H'+pad(seq),name:pad(areaSeqN(areaCode))+pad(seq)+'号货架',areaCode:areaCode,layers:genLayers(lvN||3,binN||3)};
}
var SHELVES=[];
SHELVES.push({code:'C01-K01-H01',name:'0101号货架',areaCode:'C01-K01',layers:[
  {name:'01号层级',bins:[
    {seq:1,state:'used',sku:'DMEM 高糖培养基',no:'AIWB-0011x',tag:'ESL-20230088',stock:12},
    {seq:2,state:'used',sku:'PBS缓冲液 pH7.4',no:'AIWB-0031s',tag:'ESL-20230091',stock:6},
    {seq:3,state:'used',sku:'胰蛋白酶-EDTA',no:'AIWB-0042e',tag:'ESL-20230115',stock:4}
  ]},
  {name:'02号层级',bins:[
    {seq:1,state:'used',sku:'胎牛血清',no:'AIWB-0028t',tag:'ESL-20230102',stock:3},
    {seq:2,state:'zero',sku:'青链霉素混合液 100X',no:'AIWB-0055p',tag:'ESL-20230121',stock:0},
    {seq:3,state:'empty',sku:'',no:'',tag:'',stock:0}
  ]},
  {name:'03号层级',bins:[
    {seq:1,state:'empty',sku:'',no:'',tag:'',stock:0},
    {seq:2,state:'empty',sku:'',no:'',tag:'',stock:0},
    {seq:3,state:'empty',sku:'',no:'',tag:'',stock:0}
  ]}
]});
SHELVES.push(newShelf('C01-K01',2,3,3));
SHELVES.push(newShelf('C01-K01',3,2,4));
SHELVES.push(newShelf('C01-K02',1,3,3));
function shelvesIn(areaCode){return SHELVES.filter(function(s){return s.areaCode===areaCode})}
function shelfStat(s){
  var n=0,used=0,empty=0;
  s.layers.forEach(function(l){l.bins.forEach(function(b){n++;if(b.state==='used')used++;if(b.state==='empty')empty++})});
  return {total:n,used:used,empty:empty,lv:s.layers.length};
}
var FREE_TAGS=[{tag:'ESL-20240001'},{tag:'ESL-20240002'},{tag:'ESL-20240003'}];
var FAULT_TAGS=[{tag:'ESL-20240999',why:'通讯异常'}];

/* ===== 统计 ===== */
var KIND_META={shelf:{t:'货架区',b:'b-gray'},open:{t:'散货区',b:'b-amber'},mix:{t:'混合区',b:'b-blue'}};
function kindBadge(k){var m=KIND_META[k]||KIND_META.shelf;return '<span class="badge '+m.b+'">'+m.t+'</span>'}
function areaBinStat(code){
  var n=0,bound=0;
  shelvesIn(code).forEach(function(s){s.layers.forEach(function(l){l.bins.forEach(function(b){n++;if(b.tag)bound++})})});
  return {total:n,bound:bound};
}
function whStat(w){
  var sh=0,bins=0,bound=0,open=0;
  w.areas.forEach(function(a){
    shelvesIn(a.code).forEach(function(s){sh++;s.layers.forEach(function(l){l.bins.forEach(function(b){bins++;if(b.tag)bound++})})});
    open+=(a.openItems||[]).length;
  });
  return {shelf:sh,bins:bins,bound:bound,open:open};
}

/* ===== 页面注册 ===== */
var PAGES={};
function go(p){CUR=p;render()}
function render(){
  document.querySelectorAll('.sub-item').forEach(function(el){
    el.classList.toggle('on',el.getAttribute('data-page')===CUR);
  });
  $('#content').innerHTML=(PAGES[CUR]||PAGES.wh)();
  var c=$('.content');if(c)c.scrollTop=0;
}

/* ===== 页面：仓库管理 ===== */
PAGES.wh=function(){
  var totalBins=0,totalBound=0;
  WH_LIST.forEach(function(w){var st=whStat(w);totalBins+=st.bins;totalBound+=st.bound+st.open});
  var kpi='<div class="kpi-row">'+
    '<div class="kpi"><div class="l">仓库</div><div class="n num">'+WH_LIST.length+'</div><div class="s">已启用</div></div>'+
    '<div class="kpi"><div class="l">库区</div><div class="n num">'+WH_LIST.reduce(function(s,w){return s+w.areas.length},0)+'</div><div class="s">含货架区 / 散货区 / 混合区</div></div>'+
    '<div class="kpi"><div class="l">货位</div><div class="n num">'+totalBins+'</div><div class="s">全部库区合计</div></div>'+
    '<div class="kpi"><div class="l">绑定总数</div><div class="n num">'+totalBound+'</div><div class="s">在架绑定 + 库区散货绑定</div></div>'+
    '</div>';
  var rows=WH_LIST.map(function(w){
    var st=whStat(w);
    return '<tr><td class="mono">'+w.code+'</td><td><b>'+esc(w.name)+'</b></td>'+
      '<td class="num">'+w.areas.length+'</td><td class="num">'+st.shelf+'</td><td class="num">'+st.bins+'</td>'+
      '<td class="num">'+(st.bound+st.open)+'</td>'+
      '<td><button class="btn link" onclick="goAreaOf(\''+w.code+'\')">查看库区</button>'+
      '<button class="btn link" style="color:var(--red)" onclick="delWh(\''+w.code+'\')">删除</button></td></tr>';
  }).join('');
  return '<div class="crumbs"><b>基础数据</b> / 仓库管理</div>'+
    '<div class="page-title">仓库管理</div>'+
    kpi+
    '<div class="cfg-tip"><div>配置建设第一步：仓库是最高层级，库区挂在仓库下。库区选择<b>存放模式</b>后决定是否需要建货架/层级/货位。</div></div>'+
    '<div class="panel"><div class="panel-title">仓库列表<span class="desc">共 '+WH_LIST.length+' 个</span>'+
    '<div style="margin-left:auto"><button class="btn primary" onclick="newWh()">+ 新建仓库</button></div></div>'+

function nextAreaSeq(whCode){
  var w=findWh(whCode),max=0;

}
function newArea(){

  drawerArea();
}
function editArea(code){
  var a=findArea(code);if(!a)return;
  DRAWER={type:'edit',wh:code.split('-')[0],areaCode:code,name:a.name,kind:a.kind||'shelf'};
  drawerArea();
}
function setMode(k){if(DRAWER){DRAWER.kind=k;drawerArea()}}
function pickWh(v){if(DRAWER){DRAWER.wh=v;DRAWER.name=nextAreaSeq(v)+'号库区';drawerArea()}}
function drawerArea(){

      '<div class="form-row"><div class="fld"><span class="fl">库区名称 <b>*</b></span><input class="inp" id="mAreaName" value="'+esc(d.name)+'" oninput="DRAWER.name=this.value"></div></div>'+
      '<div class="fld" style="min-width:100%"><span class="fl">存放模式 <b>*</b></span><div class="mode-cards">'+cards+'</div></div>'+
      '<div style="height:14px"></div>'+
      '<div class="form-row"><div class="fld"><span class="fl">库区标识码</span><input class="inp" readonly value="'+esc(code)+'">'+
      '<span class="fl-hint">'+(d.kind==='open'?'散货区必配':(d.kind==='mix'?'混合区必配':'货架区可选（便于后续切换为混合区）'))+'：贴于库区入口，PDA 扫码即可绑定到本库区</span></div>'+
      '<div class="fld" style="flex:0 0 auto;justify-content:flex-end"><button class="btn" onclick="printAreaCode(\''+code+'\')">打印二维码</button></div></div>'+
      '<div class="fld" style="min-width:100%"><span class="fl">货架与货位</span>'+shelfHint+'</div>',

function saveArea(){
  var d=DRAWER;if(!d)return;
  var name=(d.name||'').trim();
  if(!name){toast('请填写库区名称');return}
  if(d.type==='new'){
    var w=findWh(d.wh);
    var code=d.wh+'-K'+pad(nextAreaSeq(d.wh));
    w.areas.push({code:code,name:name,kind:d.kind,openItems:[]});
    closeModal();render();
    toast('已创建库区 '+name+'（'+(KIND_META[d.kind]||KIND_META.shelf).t+'）'+(d.kind==='open'?'：无需配置货架，可打印库区码':'：请到「货架与货位」建货架'));
    return;
  }
  var a=findArea(d.areaCode);if(!a)return;
  var old=a.kind||'shelf',sh=shelvesIn(a.code).length,st=areaBinStat(a.code),op=(a.openItems||[]).length;
  if(old!==d.kind){
    if((old==='shelf'||old==='mix')&&d.kind==='open'&&(sh||st.bound)){
      openModal({title:'无法切换为散货区',
        body:'该库区存在 <b>'+sh+'</b> 个货架、<b>'+st.bound+'</b> 个在架绑定。<br>请先去绑价签并删除货架后再切换。',
        foot:'<button class="btn primary" onclick="closeDrawerGoShelf(\''+a.code+'\')">去货架与货位</button>'});
      return;
    }
    if(old==='open'&&d.kind!=='open'&&op){
      openModal({title:'无法切换为'+(d.kind==='mix'?'混合区':'货架区'),
        body:'该库区存在 <b>'+op+'</b> 个散货绑定。<br>请先去绑（PDA 散货列表 → 去绑价签）后再切换。',
        foot:'<button class="btn primary" onclick="closeModal()">知道了</button>'});
      return;
    }
    if(old==='mix'&&d.kind==='shelf'&&op){
      openModal({title:'无法切换为货架区',
        body:'该库区存在 <b>'+op+'</b> 个散货绑定，请先去绑后再切换。',
        foot:'<button class="btn primary" onclick="closeModal()">知道了</button>'});
      return;
    }
  }
  a.name=name;a.kind=d.kind;
  closeModal();render();toast('已保存库区 '+a.code+'（'+(KIND_META[d.kind]||KIND_META.shelf).t+'）');
}

function delArea(code){
  var a=findArea(code);if(!a)return;
  var sh=shelvesIn(code).length,op=(a.openItems||[]).length;
  if(sh||op){openModal({title:'无法删除库区',body:'该库区存在 <b>'+sh+'</b> 个货架、<b>'+op+'</b> 个散货绑定。<br>请先清理后删除。',foot:'<button class="btn primary" onclick="closeModal()">知道了</button>'});return}
  openModal({title:'删除库区',body:'确认删除 <b>'+esc(a.name)+'</b>（'+code+'）？删除后编码不回收。',
    foot:'<button class="btn" onclick="closeModal()">取消</button><button class="btn danger" onclick="doDelArea(\''+code+'\')">确认删除</button>'});
}
function doDelArea(code){
  var w=findWh(code.split('-')[0]);

function eslRows(){
  var rows=[];
  WH_LIST.forEach(function(w){w.areas.forEach(function(a){
    shelvesIn(a.code).forEach(function(s){s.layers.forEach(function(l){
      l.bins.forEach(function(b){
        if(b.tag)rows.push({tag:b.tag,sku:b.sku,bin:s.code+'-'+pad(s.layers.indexOf(l)+1)+'-'+pad(b.seq),
          state:b.stock===0?'zero':'used',where:w.name+' / '+a.name});
      });
    })});
    (a.openItems||[]).forEach(function(o){
      rows.push({tag:o.tag,sku:o.sku,bin:a.code+'（库区散货）',state:o.stock===0?'zero':'used',where:w.name+' / '+a.name});
    });
  })});
  FREE_TAGS.forEach(function(t){rows.push({tag:t.tag,sku:'—',bin:'—',state:'free',where:'—'})});
  FAULT_TAGS.forEach(function(t){rows.push({tag:t.tag,sku:'—',bin:'—',state:'fault',where:t.why})});
  return rows;
}
var ESL_FILTER='全部';
PAGES.esl=function(){
  var all=eslRows();
  var list=ESL_FILTER==='全部'?all:all.filter(function(r){
    return ESL_FILTER==='已绑'?r.state==='used':r.state===({零库存:'zero',空闲:'free',故障:'fault'})[ESL_FILTER];
  });
  var chips=['全部','已绑','零库存','空闲','故障'].map(function(c){
    return '<span class="badge '+(ESL_FILTER===c?'b-blue':'b-gray')+' click" onclick="ESL_FILTER=\''+c+'\';render()">'+c+'</span>';
  }).join(' ');
  var SM={used:['已绑','b-blue'],zero:['零库存','b-green'],free:['空闲','b-gray'],fault:['故障','b-red']};
  var rows=list.map(function(r){
    var m=SM[r.state];
    return '<tr><td class="mono">'+r.tag+'</td><td><span class="badge '+m[1]+'">'+m[0]+'</span></td>'+
      '<td>'+esc(r.sku)+'</td><td class="mono">'+r.bin+'</td><td>'+esc(r.where)+'</td>'+
      (r.state==='fault'?'<td><button class="btn link" onclick="toast(\'已生成价签维修工单（演示）\')">提报维修</button></td>':'<td></td>')+'</tr>';
  }).join('');
  return '<div class="crumbs"><b>仓储管理</b> / 库位配置 / 价签管理</div>'+
    '<div class="page-title">价签管理<span class="tag-new">新</span></div>'+
    '<div class="cfg-tip">价签状态由绑定关系驱动：绑定商品 → <b>已绑</b>；库存清零 → <b>零库存</b>；未启用 → <b>空闲</b>；异常 → <b>故障</b>。价签不需要打印，由系统推送墨水屏。</div>'+
    '<div class="panel"><div class="filter"><span class="flab">状态</span>'+chips+
    '<span class="mono" style="margin-left:auto">共 '+all.length+' 个</span></div>'+
    '<table class="tb"><thead><tr><th>价签编码</th><th>状态</th><th>绑定商品</th><th>绑定目标</th><th>所在位置</th><th></th></tr></thead><tbody>'+
    (rows||'<tr><td colspan="6" style="text-align:center;color:var(--muted2);padding:30px">暂无记录</td></tr>')+
    '</tbody></table></div>';
};

/* ===== 页面：标签打印 ===== */
PAGES.tag=function(){
  var rows=[];
  WH_LIST.forEach(function(w){w.areas.forEach(function(a){
    var k=a.kind||'shelf';
    rows.push('<tr><td class="mono">'+a.code+'</td><td>'+esc(w.name)+' / '+esc(a.name)+'</td>'+
      '<td>'+kindBadge(k)+'</td>'+
      '<td>'+(k==='shelf'?'<span class="badge b-gray">可选</span>':'<span class="badge b-amber">必配</span>')+'</td>'+
      '<td><button class="btn link" onclick="printAreaCode(\''+a.code+'\')">打印二维码</button></td></tr>');
  })});
  return '<div class="crumbs"><b>仓储管理</b> / 库位配置 / 标签打印</div>'+
    '<div class="page-title">标签打印<span class="tag-new">新</span></div>'+
    '<div class="cfg-tip">库区标识码贴于库区入口，PDA 扫此码即可把商品绑定到该库区；<b>散货区 / 混合区必配</b>。层标与货位标用于货架区绑定与补打。价签不需要打印（电子墨水屏，系统推送）。</div>'+
    '<div class="panel"><div class="panel-title">库区标识码<span class="desc">编码段数：5 段=货位、4 段=层标、2 段=库区</span></div>'+
    '<table class="tb"><thead><tr><th>库区编码</th><th>所属</th><th>存放模式</th><th>标识码</th><th>操作</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<div class="panel"><div class="panel-title">层标 / 货位标'+
    '<div style="margin-left:auto"><button class="btn" onclick="toast(\'已生成层标打印任务（演示）\')">批量打印层标</button> '+
    '<button class="btn" onclick="toast(\'已生成货位标打印任务（演示）\')">批量补打货位标</button></div></div>'+
    '<div class="rule-note">'+
    '· 层标：<span class="mono">C01-K01-H01-02</span>（仓库-库区-货架-层级）<br>'+
    '· 货位标：<span class="mono">C01-K01-H01-02-03</span>（层标 + 货位序号）<br>'+
    '· 散货区不产生层标与货位标</div></div>';
};

/* ===== 侧栏事件与初始渲染 ===== */
document.querySelectorAll('[data-page]').forEach(function(el){
  el.addEventListener('click',function(){go(el.getAttribute('data-page'))});
});
document.getElementById('menu-loc').addEventListener('click',function(){
  this.classList.toggle('open');
  document.getElementById('sub-loc').classList.toggle('show');
});
render();
</script>
</body>
</html>
